[package]
name = "deltalakedb-sql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
deltalakedb-core = { path = "../core" }
duckdb = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
deltalakedb-observability = { path = "../observability" }
url = { workspace = true }

[features]
# Keep default builds MSRV-friendly (Rust 1.75) by not enabling the DuckDB
# adapter unless explicitly requested.
default = []
duckdb = ["dep:duckdb"]

[dev-dependencies]
serial_test = "2"
tempfile = "3"
